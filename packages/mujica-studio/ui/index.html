<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mujica Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script id="mujica-studio-route-manifest" type="application/json">
      {
        "version": 1,
        "kind": "mujica-studio-route-manifest",
        "renderer": { "id": "mujica-studio-react-v2", "sourceHash": "development" },
        "project": { "id": "development", "name": "Mujica Studio Development" },
        "defaultRoute": "/overview",
        "paths": {
          "project": "./data/project.json",
          "designs": "./data/designs.json",
          "runs": "./data/runs.json",
          "compare": null
        },
        "packagedRuns": []
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
